@if (session.loading()) {
  <div class="connection-note" role="status">Đang kiểm tra phiên đăng nhập…</div>
}
@if (navigation.navigating()) {
  <mat-progress-bar class="navigation-progress" mode="indeterminate" aria-label="Đang mở trang…" />
}
@if (navigation.navigationFailed()) {
  <div class="form-notice error" role="alert">
    Không mở được trang. Kiểm tra kết nối rồi
    <button type="button" (click)="reload()">tải lại trang</button>.
  </div>
}
<router-outlet />
